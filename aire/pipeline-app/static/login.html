<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Pipeline sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #f3eee6;
    font: 16px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left); }
  main { width: min(100%, 22rem); display: grid; gap: 16px; }
  h1 { margin: 0; font: 400 34px/1.1 "Iowan Old Style", Palatino, Georgia, serif; }
  p { margin: 0; color: #aaa298; font-size: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; color: #aaa298; }
  input { font: inherit; font-size: 17px; color: #f3eee6; background: #141215; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 14px; }
  input:focus-visible, button:focus-visible { outline: 2px solid #e87757; outline-offset: 2px; }
  button { font: inherit; font-weight: 600; color: #160c08; background: #e87757; border: 0; border-radius: 999px; padding: 14px; min-height: 48px; cursor: pointer; }
  #msg { min-height: 1.5em; color: #ff8a70; }
  footer { font-size: 12px; color: #8a837b; }
</style>
</head>
<body>
<main>
  <h1>Pipeline</h1>
  <p>Caleb Jackson · Keller Williams First Choice. Signed-in devices stay signed in for 30 days.</p>
  <form id="f">
    <label for="pc">Passcode</label>
    <input id="pc" type="password" autocomplete="current-password" required minlength="10" autofocus>
    <p id="msg" role="alert" aria-live="assertive"></p>
    <button type="submit">Sign in</button>
  </form>
  <footer>Five wrong tries lock this device out for 10 minutes. The passcode is set on the Mac.</footer>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const m = document.getElementById('msg'); m.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: document.getElementById('pc').value }) });
    const d = await r.json();
    if (d.ok) location.replace('/#dash'); else m.textContent = 'Not signed in: ' + d.error + '.';
  } catch (err) { m.textContent = 'Pipeline did not answer. Is the Mac awake?'; }
});
</script>
</body>
</html>
