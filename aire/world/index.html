<style>
/* Layout: the model town on the left, a dashboard rail on the right (brief, up next, calendar, to-dos, inbox, charts).
   One deliberate daylight look on warm paper; Keller Williams First Choice coral marks anything that needs Caleb. */
:root{
  --paper:#f3ede3; --ink:#14100e; --ink-2:#6b625a; --ink-3:#9a908a; --ivory:#fbf8f3; --coral:#e87757; --coral-2:#d4603f;
  --gold:#e9c46a; --sage:#9bbf8a; --line:rgba(20,16,14,.12); --glass:rgba(251,248,243,.78); --panel:#fbf8f3;
  --c1:#d9532e; --c2:#2a78d6; --c3:#c98a00; --c4:#1baf7a; --c5:#6250d6; --c6:#e34948;
  --display:'Instrument Serif',Georgia,serif; --body:Nunito,'Segoe UI',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;padding:0}
#app{display:grid;grid-template-columns:1fr minmax(340px,400px);height:100%;min-height:0}
#stagewrap{position:relative;min-width:0;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}#stage.pick{cursor:pointer}
.hud{position:absolute;z-index:3;pointer-events:none}.hud>*{pointer-events:auto}
#title{top:calc(env(safe-area-inset-top,0px) + 16px);left:var(--gl);max-width:min(60%,440px)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 3px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:.98;margin:0;letter-spacing:-.01em;text-wrap:balance}
#live{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#live i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgba(232,119,87,.25);display:inline-block}
#live i.stale{background:#a9a29a;box-shadow:none}
#live b{color:var(--ink);font-weight:700;letter-spacing:.08em;font-size:11px}
#legend{left:var(--gl);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--ink);font:inherit;font-size:12px;padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .2s}
.chip:hover,.chip:focus-visible{border-color:var(--coral);outline:none}
.chip[aria-pressed="true"]{border-color:var(--coral);background:var(--ivory)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--coral));flex:none}
#controls{right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;gap:6px}
.btn{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--ink);font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--coral);outline:none}
.btn[aria-pressed="true"]{border-color:var(--coral);background:var(--ivory)}
.label{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-100%);font-family:var(--display);font-size:14px;color:var(--ink);background:rgba(251,248,243,.7);padding:1px 7px;border-radius:3px;white-space:nowrap;transition:opacity .25s;will-change:transform}
#tip{position:absolute;z-index:4;pointer-events:none;background:var(--ivory);border:1px solid var(--line);padding:6px 9px;display:none;transform:translate(14px,14px);font-size:12.5px;box-shadow:0 4px 14px rgba(20,16,14,.12);max-width:240px}
#tip.show{display:block}#tip small{display:block;color:var(--ink-2);font-size:11px}
/* rail */
#rail{min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--ivory);border-left:1px solid var(--line);padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 20px) 16px;display:grid;gap:14px;align-content:start;scrollbar-width:thin}
.sec{display:grid;gap:8px}
.sec h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;line-height:1.1;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-family:var(--body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);padding:9px 11px 8px;display:grid;gap:0;background:var(--paper);min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-size:1.6rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v.bump{color:var(--coral-2)}
.tile .s{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief{font-size:13.5px;line-height:1.5;margin:0}
.list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11.5px;white-space:nowrap;min-width:64px}
.list .t.now{color:var(--coral-2);font-weight:700}
.list .t.over{color:var(--c6);font-weight:700}
.list .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .m small{display:block;color:var(--ink-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .pill{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);margin-left:6px;vertical-align:1px}
.list .pill.hot{border-color:var(--coral);color:var(--coral-2)}
.empty{font-size:12.5px;color:var(--ink-2);border:1px dashed var(--line);padding:10px 12px;margin:0}
.empty code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--paper);padding:1px 4px}
.chart{display:grid;gap:4px}
.chart h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible;font-family:var(--body)}
.chart .lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.chart .lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
.chart .cap{font-size:11px;color:var(--ink-2);margin:0}
#ctip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--ivory);font-size:12px;padding:5px 8px;border-radius:3px;display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#ctip.show{display:block}
/* docked card */
#card{display:none;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c,var(--coral))}
#card.show{display:flex}
#card header{padding:10px 12px 6px;display:grid;gap:2px;position:relative}
#card .kind{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--coral))}
#card h2{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.05;margin:0;padding-right:28px}
#card .sub{font-size:12px;color:var(--ink-2);margin:0}
#card .x{position:absolute;top:6px;right:6px;background:transparent;border:0;color:var(--ink-2);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px}
#card dl{margin:0;padding:2px 12px 8px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:baseline}
#card dt{font-size:12px;color:var(--ink);min-width:0}#card dt small{display:block;font-size:10.5px;color:var(--ink-2)}
#card dd{margin:0;font-family:var(--display);font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#card dd.txt{font-family:var(--body);font-size:12px;white-space:normal;max-width:150px}
#card dd.bump{color:var(--coral-2)}
#card .src{font-size:10.5px;color:var(--ink-2);padding:6px 12px 10px;border-top:1px solid var(--line)}
#card .clist{padding:0 12px 6px;font-size:12px;display:grid;gap:3px}
#card .clist div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
#card .clist span:last-child{color:var(--ink-2)}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--ivory);padding:7px 14px;font-size:13px;display:none}
#toast.show{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:52vh 1fr}
  #rail{border-left:0;border-top:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr)}
  #title{max-width:calc(100% - 120px)}h1{font-size:1.6rem}
  #legend{display:none}
  #controls .btn span{display:none}
  .label{font-size:12px}
}
</style>

  <section class="sec" id="s-inbox"><h2>Inbox <small id="inbox-n"></small></h2><ul class="list" id="inbox-list"></ul></section>

  <section class="sec" id="s-charts"><h2>Charts</h2>

    <div class="chart" id="ch-spend"></div>
  </section>
</aside>
</div>

const ctip=$('#ctip');
function tipOn(e,text){ ctip.textContent=text; ctip.classList.add('show'); tipMove(e); }
function tipMove(e){ const x=Math.min(innerWidth-ctip.offsetWidth-8,e.clientX+12), y=Math.max(8,e.clientY-30); ctip.style.left=x+'px'; ctip.style.top=y+'px'; }
function tipOff(){ ctip.classList.remove('show'); }
function svgEl(tag,attrs){ const el=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }
function chartHead(host,title){ host.innerHTML=''; const h3=document.createElement('h3'); h3.textContent=title; host.appendChild(h3); }
function hbars(host,title,rows,opts){ opts=opts||{}; chartHead(host,title);
  if(!rows.length||rows.every(r=>!r.value)){ const p=document.createElement('p'); p.className='empty'; p.textContent=opts.empty||'No data yet.'; host.appendChild(p); return; }
  const w=360, rowH=22, pad=4, lw=opts.labelW||118, vw=opts.valueW||74, h=rows.length*rowH+pad; const max=Math.max(...rows.map(r=>r.value||0),1);
  const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,role:'img','aria-label':title});
  rows.forEach((r,i)=>{ const y=i*rowH+pad; const bw=Math.max(2,(r.value||0)/max*(w-lw-vw-8));
    const lab=svgEl('text',{x:lw-8,y:y+13,'text-anchor':'end','font-size':'11.5',fill:'#14100e'}); lab.textContent=r.label; svg.appendChild(lab);
    svg.appendChild(svgEl('rect',{x:lw,y:y+3,width:bw,height:rowH-8,rx:4,fill:r.color}));
    const vt=svgEl('text',{x:lw+bw+6,y:y+13,'font-size':'11.5',fill:'#14100e'}); vt.textContent=r.text||fmt(r.value); svg.appendChild(vt);
    const hit=svgEl('rect',{x:0,y:y,width:w,height:rowH,fill:'transparent'}); hit.addEventListener('mousemove',e=>tipOn(e,(r.hint||r.label)+': '+(r.text||fmt(r.value)))); hit.addEventListener('mouseleave',tipOff); svg.appendChild(hit); });
  host.appendChild(svg); if(opts.cap){ const p=document.createElement('p'); p.className='cap'; p.textContent=opts.cap; host.appendChild(p); } }
function segbar(host,title,segs,cap){ chartHead(host,title);
  const total=segs.reduce((a,s)=>a+(s.value||0),0); if(!total){ const p=document.createElement('p'); p.className='empty'; p.textContent='No contacts yet.'; host.appendChild(p); return; }
  const w=360,h=26; const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,role:'img','aria-label':title}); let x=0; segs.forEach(s=>{ const sw=Math.max(0,(s.value||0)/total*w-2); if(sw<=0) return; const r=svgEl('rect',{x:x,y:4,width:sw,height:18,rx:3,fill:s.color}); r.addEventListener('mousemove',e=>tipOn(e,s.label+': '+fmt(s.value)+' ('+Math.round(s.value/total*100)+'%)')); r.addEventListener('mouseleave',tipOff); svg.appendChild(r); if(sw>44){ const tt=svgEl('text',{x:x+6,y:17,'font-size':'11',fill:s.dark?'#14100e':'#fbf8f3','pointer-events':'none'}); tt.textContent=fmt(s.value); svg.appendChild(tt);} x+=sw+2; }); host.appendChild(svg);
  const lg=document.createElement('div'); lg.className='lg'; segs.forEach(s=>{ const sp=document.createElement('span'); sp.style.setProperty('--c',s.color); sp.textContent=s.label+' '+fmt(s.value); lg.appendChild(sp); }); host.appendChild(lg); if(cap){ const p=document.createElement('p'); p.className='cap'; p.textContent=cap; host.appendChild(p);} }
function spark(host,title,series,opts){ opts=opts||{}; chartHead(host,title);
  const pts=series.filter(p=>p.value!=null); if(pts.length<2){ const p=document.createElement('p'); p.className='empty'; p.textContent=opts.empty||('History starts today: '+(pts.length?fmt(pts[0].value,opts.fmt)+' on '+pts[0].label:'no rows yet')+'. The line draws itself from tomorrow.'); host.appendChild(p); return; }
  const w=360,h=90,pl=8,pr=46,pt=10,pb=18; const max=Math.max(...pts.map(p=>p.value),1); const X=i=>pl+i/(pts.length-1)*(w-pl-pr), Y=v=>pt+(1-v/max)*(h-pt-pb);
  const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,role:'img','aria-label':title});
  [0,0.5,1].forEach(f=>{ const y=pt+f*(h-pt-pb); svg.appendChild(svgEl('line',{x1:pl,x2:w-pr,y1:y,y2:y,stroke:'rgba(20,16,14,.1)','stroke-width':1})); });
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
  svg.appendChild(svgEl('path',{d:d+' L'+X(pts.length-1).toFixed(1)+' '+(h-pb)+' L'+pl+' '+(h-pb)+' Z',fill:opts.color||CAT[0],opacity:.12}));
  svg.appendChild(svgEl('path',{d,fill:'none',stroke:opts.color||CAT[0],'stroke-width':2,'stroke-linejoin':'round'}));
  const last=pts[pts.length-1]; svg.appendChild(svgEl('circle',{cx:X(pts.length-1),cy:Y(last.value),r:4,fill:opts.color||CAT[0],stroke:'#fbf8f3','stroke-width':2}));
  const vt=svgEl('text',{x:X(pts.length-1)+8,y:Y(last.value)+4,'font-size':'11.5',fill:'#14100e'}); vt.textContent=fmt(last.value,opts.fmt); svg.appendChild(vt);
  const l0=svgEl('text',{x:pl,y:h-4,'font-size':'10.5',fill:'#6b625a'}); l0.textContent=pts[0].label; svg.appendChild(l0); const l1=svgEl('text',{x:w-pr,y:h-4,'font-size':'10.5',fill:'#6b625a','text-anchor':'end'}); l1.textContent=last.label; svg.appendChild(l1);
  pts.forEach((p,i)=>{ const cw=(w-pl-pr)/(pts.length-1); const hit=svgEl('rect',{x:X(i)-cw/2,y:0,width:cw,height:h,fill:'transparent'}); hit.addEventListener('mousemove',e=>tipOn(e,p.label+': '+fmt(p.value,opts.fmt))); hit.addEventListener('mouseleave',tipOff); svg.appendChild(hit); });
  host.appendChild(svg); if(opts.cap){ const p=document.createElement('p'); p.className='cap'; p.textContent=opts.cap; host.appendChild(p);} }
function renderCharts(){
  const bs=get(DATA,'deals.by_stage')||{}; const order=[['active','Active',CAT[0]],['showing','Showing',CAT[1]],['under_contract','Under contract',CAT[2]],['closed','Closed',CAT[3]]];
  const hs=get(DATA,'deals.houses')||[]; const volume=k=>hs.filter(h=>h.stage===k).reduce((a,h)=>a+(h.price||0),0);
  const rows=order.map(([k,l,c])=>({label:l,value:volume(k)||((bs[k]||0)?1:0),color:c,text:(bs[k]||0)+' · '+money(volume(k)),hint:l})).concat(Object.keys(bs).filter(k=>!order.some(o=>o[0]===k)).map(k=>({label:k.replace('_',' '),value:volume(k),color:CAT[4],text:(bs[k]||0)+' · '+money(volume(k))})));
  hbars($('#ch-stage'),'Pipeline by stage',rows,{cap:'Deals tab. Count and dollar volume per stage.',labelW:106,valueW:122});
  segbar($('#ch-band'),'The sphere by band',[['hot','Hot'],['warm','Warm'],['cold','Cold'],['ice_cold','Ice cold'],['unbanded','No band']].map(([k,l])=>({label:l,value:val('people.'+k)||0,color:BANDRAMP[k==='ice_cold'?'ice-cold':k],dark:k!=='hot'&&k!=='warm'})),'Contacts tab, band column. Hot to cold, one hue.');
  spark($('#ch-leads'),'New leads, last 14 days',HIST.slice(-14).map(h=>({label:h.date.slice(5),value:h.new_leads_7d})),{color:CAT[1],cap:'Rolling 7-day count, one point per day the sync ran.'});
  const sp=get(DATA,'spending')||{}; const cats=(sp.by_category_30d||[]).slice(0,6);
  if(cats.length) hbars($('#ch-spend'),'Spending by category, 30 days',cats.map((c,i)=>({label:c.category,value:c.total,color:CAT[i%CAT.length],text:money(c.total)})),{cap:'Spending tab. '+money(sp.last_30d&&sp.last_30d.value)+' in 30 days, '+money(sp.last_7d&&sp.last_7d.value)+' this week.',labelW:106,valueW:80});
  else hbars($('#ch-spend'),'Spending by category, 30 days',[],{empty:'Add rows to the Spending tab in the CRM sheet (date, vendor, amount, category) and the chart draws on the next sync.'});
  $('#s-sp').textContent=(sp.rows_30d&&sp.rows_30d.value)?(sp.rows_30d.value+' rows · '+money(sp.last_7d&&sp.last_7d.value)+' this week'):'Spending tab is empty';
}

// ---------- live data ----------
const live={inbox:null,inboxMsg:'',calMsg:''};
function tween(el,from,to,f){ if(reduced||typeof to!=='number'||typeof from!=='number'){ el.textContent=fmt(to,f); return; } const t0=performance.now(), d=900; const step=now=>{ const k=Math.min(1,(now-t0)/d); const e=1-Math.pow(1-k,3); el.textContent=fmt(from+(to-from)*e,f); if(k<1) requestAnimationFrame(step); else el.textContent=fmt(to,f); }; requestAnimationFrame(step); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),1400); }
function applyData(fresh,first){ const old=DATA; DATA=fresh;
  document.querySelectorAll('[data-n]').forEach(el=>{ const p=el.dataset.n; const nv=val(p); const ov=get(old,p); const ovv=ov&&typeof ov==='object'?ov.value:ov; if(first||nv!==ovv) tween(el,typeof ovv==='number'?ovv:nv,nv,el.dataset.fmt); });
  $('#hw').textContent=fmt(val('people.hot'))+' · '+fmt(val('people.warm'));
  $('#s-uc').textContent=fmt(val('deals.under_contract'))+' deals · next close '+(val('deals.next_close')||'—');
  const pcs=(get(DATA,'deals.pending_commission')||{}).source||''; const m=pcs.match(/\((\d+ of \d+)/); $('#s-pc').textContent=val('deals.pending_commission')==null?(/no commission/.test(pcs)?'no figures in the sheet yet':'not synced'):(m?m[1]+' deals still need a figure':fmt(val('deals.live'))+' live deals');
  $('#s-hw').textContent='of '+fmt(val('people.contacts'))+' contacts · '+fmt(val('people.new_leads_7d'))+' new this week';
  if(first||JSON.stringify(get(old,'deals.houses'))!==JSON.stringify(get(DATA,'deals.houses'))) buildStreet();
  if(first||val('people.new_leads_7d')!==(get(old,'people.new_leads_7d')||{}).value) buildCars();
  if(first||val('people.hot')!==(get(old,'people.hot')||{}).value) buildWalkers();
  paintBoard(); if(sel){ const prev=[...document.querySelectorAll('#c-stats dd')].map(d=>[d.dataset.key,d.dataset.v]); renderCard(); document.querySelectorAll('#c-stats dd').forEach(d=>{ const p=prev.find(x=>x[0]===d.dataset.key); if(p&&p[1]!==d.dataset.v&&!d.classList.contains('txt')){ const a=+p[1],b=+d.dataset.v; if(!isNaN(a)&&!isNaN(b)) tween(d,a,b,/\$/.test(d.textContent)?'money':undefined); } }); }
  renderRail(); liveDot(); }
function liveDot(){ const s=DATA.sync||{}; const at=s.at?new Date(s.at):null; const min=at?Math.max(0,Math.round((Date.now()-at)/60000)):null; const dot=$('#dot'); const stale=min==null||min>30||s.ok===false; dot.classList.toggle('stale',stale);
  $('#upd').textContent=min==null?'no sync yet':((s.ok===false?'last good sync ':'updated ')+(min<1?'just now':min+' min ago')+(s.ok===false?' · last sync failed':'')); }
async function getJSON(name){ const r=await fetch(name+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(String(r.status)); return r.json(); }
async function refresh(){ try{ const j=await getJSON('data.json'); if(j&&j.sync) applyData(j,false); }catch(e){} try{ const h=await getJSON('history.json'); if(Array.isArray(h)) HIST=h; }catch(e){} try{ const b=await getJSON('brief.json'); if(b&&b.at) BRIEF=b; }catch(e){} renderRail(); liveDot(); }
// claude.ai preview: calendar and inbox through the viewer's own connectors when there is no brief.json
async function startMcp(){ if(!window.claude||!window.claude.use) return; const mcp=await claude.use('mcp'); if(!mcp||BRIEF) return;
  const errCopy=(code,server)=>({server_not_connected:'Add '+server+' in claude.ai Settings → Connectors',needs_reauth:'Reconnect '+server+' in Settings → Connectors',not_in_manifest:server+' not allowed for this view',selection_required:'Choose which '+server+' to use'})[code]||(server+' could not load ('+code+')');
  const p=n=>String(n).padStart(2,'0'); const d0=new Date(); d0.setHours(0,0,0,0); const d1=new Date(d0); d1.setDate(d1.getDate()+1); const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  mcp.watchTool('Google Calendar','list_events',{startTime:iso(d0),endTime:iso(d1),orderBy:'startTime',pageSize:100},ev=>{ if(BRIEF&&BRIEF.tasks) return; if(ev.type==='data'){ const evs=((ev.result.payload||{}).events||[]).filter(e=>e.status!=='cancelled'&&e.transparency!=='transparent'); BRIEF=Object.assign(BRIEF||{at:new Date().toISOString(),tasks:null,next_actions:null,inbox:null},{calendar:evs.map(e=>{ const st=e.start||{}; const dt=st.dateTime?new Date(st.dateTime):null; return {time:dt?dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'all day',at:dt?dt.toISOString():d0.toISOString(),title:e.summary||'(no title)',all_day:!dt}; })}); } else live.calMsg=errCopy(ev.error.code,'Google Calendar'); renderRail(); },{refetchInterval:300000,cache:{staleTime:60000}});
  mcp.watchTool('Gmail','search_threads',{query:'in:inbox newer_than:3d -from:me',pageSize:25,view:'THREAD_VIEW_SUMMARY'},ev=>{ if(ev.type==='data'){ live.inbox=((ev.result.payload||{}).threads||[]).map(t=>{ const m=(t.messages&&t.messages[0])||{}; return {subject:m.subject,sender:(m.sender||'').replace(/<.*>/,'').trim()}; }); } else live.inboxMsg=errCopy(ev.error.code,'Gmail'); renderRail(); },{refetchInterval:300000,cache:{staleTime:60000}}); }
applyData(DATA,true); setInterval(refresh,60000); setInterval(liveDot,30000); setTimeout(refresh,800); setTimeout(startMcp,1200);

// ---------- animation (calm) ----------
const clock=new THREE.Clock(); let T=0;
function frame(){ requestAnimationFrame(frame); if(document.hidden) return; const dt=Math.min(clock.getDelta(),0.05); T+=dt; idleT+=dt;
  if(spin&&idleT>4&&!sel) cam.tTheta+=dt*0.03;
  const k=1-Math.pow(0.004,dt); cam.theta+=(cam.tTheta-cam.theta)*k; cam.phi+=(cam.tPhi-cam.phi)*k; cam.radius+=(cam.tRadius-cam.radius)*k*0.7; cam.target.lerp(cam.tTarget,k*0.7);
  camera.position.set(cam.target.x+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta)); camera.lookAt(cam.target);
  const tmp=new THREE.Vector3(); cars.forEach(c=>{ c.t=(c.t+c.v*dt)%1; const p=ROAD.getPointAt(c.t); const q=ROAD.getPointAt((c.t+0.01)%1); c.g.position.copy(p); c.g.lookAt(q.x,p.y,q.z); c.g.rotateY(Math.PI/2); });
  walkers.forEach(w=>{ w.t+=w.v*dt*w.dir; if(w.t>1){w.t=1;w.dir=-1;} if(w.t<0){w.t=0;w.dir=1;} tmp.lerpVectors(w.from,w.to,w.t); w.g.position.copy(tmp); w.g.position.y=Math.abs(Math.sin(w.t*40))*0.05; w.g.lookAt(w.dir>0?w.to:w.from); });
  const of=OBJ.office.group.userData.flag; of.rotation.y=Math.sin(T*2)*0.1;
  const po=OBJ.post.group.userData; const per=Math.max(20,48-Math.min(26,(val('people.next_actions')||0)/20)); const cyc=(T%per)*(24/per); po.truck.position.x=cyc<6?-14+cyc*2.4:(cyc<14?0.4:(cyc<20?0.4+(cyc-14)*2.4:14.8)); po.truck.visible=cyc<20; po.mflag.rotation.z=cyc>6&&cyc<14?-Math.PI/2:0;
  const sq=OBJ.square.group.userData; sq.jet.position.y=2.4+Math.sin(T*3)*0.1; sq.oak.children.forEach(m=>{ if(m.userData.moss) m.rotation.z=Math.sin(T*1.1+m.position.x)*0.08; });
  if(crane){ const busy=(val('engine.tasks_open')||0)>0||(get(DATA,'match.unmatched')||0)>0; if(busy&&!reduced) crane.userData.arm.rotation.y=Math.sin(T*0.25)*0.8+0.6; }
  houses.forEach(h=>{ h.g.userData.sign.rotation.y=Math.sin(T*1.6+h.g.userData.swing)*0.05; });
  if(clockHands){ const now=new Date(); clockHands.m.rotation.z=-(now.getMinutes()/60)*Math.PI*2; clockHands.h.rotation.z=-((now.getHours()%12)/12+now.getMinutes()/720)*Math.PI*2; }
  const lamp=OBJ.court.group.userData.lamp; const hot=(get(DATA,'calendar.deadlines')||[]).some(d=>d.date===todayISO()); lamp.material.emissiveIntensity=hot?0.5+Math.sin(T*3)*0.35:0.15;
  renderer.render(scene,camera); placeLabels(); }
frame();
})();
</script>
