<title>AIRE World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a model town on a table, full bleed, with a thin HUD at the edges and a frosted card beside the clicked object.
   One deliberate daylight look: warm paper table, KW First Choice coral for anything that needs Caleb. */
:root{
  --paper:#f3ede3; --ink:#14100e; --ink-2:#6b625a; --ivory:#fbf8f3; --coral:#e87757; --coral-2:#d4603f;
  --gold:#e9c46a; --sage:#9bbf8a; --line:rgba(20,16,14,.14); --glass:rgba(251,248,243,.74);
  --display:'Instrument Serif',Georgia,serif; --body:Nunito,'Segoe UI',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;padding-left:var(--gl);padding-right:var(--gr);padding-block:0}
#stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}#stage.pick{cursor:pointer}
.hud{position:fixed;z-index:3;pointer-events:none}.hud>*{pointer-events:auto}
#title{top:calc(env(safe-area-inset-top,0px) + 16px);left:var(--gl);max-width:min(46vw,440px)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 3px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4vw,2.8rem);line-height:.98;margin:0;letter-spacing:-.01em;text-wrap:balance}
#live{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#live i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgba(232,119,87,.25);display:inline-block}
#live i.stale{background:#a9a29a;box-shadow:none}
#live b{color:var(--ink);font-weight:700;letter-spacing:.08em;font-size:11px}
#bar{top:calc(env(safe-area-inset-top,0px) + 16px);right:var(--gr);display:flex;gap:8px}
.tile{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);padding:9px 12px 8px;min-width:108px;display:grid;gap:0}
.tile .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-size:1.75rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#legend{left:var(--gl);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px;flex-wrap:wrap;max-width:min(70vw,720px)}
.chip{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--ink);font:inherit;font-size:12px;padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .2s,transform .2s}
.chip:hover,.chip:focus-visible{border-color:var(--coral);outline:none;transform:translateY(-1px)}
.chip[aria-pressed="true"]{border-color:var(--coral);background:var(--ivory)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--coral));flex:none}
#controls{right:var(--gr);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px}
.btn{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--ink);font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--coral);outline:none}
.btn[aria-pressed="false"]{color:var(--ink-2)}
#card{position:fixed;z-index:4;width:min(320px,calc(100vw - 32px));background:var(--glass);border:1px solid rgba(251,248,243,.9);box-shadow:0 18px 50px rgba(20,16,14,.18),0 1px 0 rgba(255,255,255,.6) inset;backdrop-filter:blur(16px) saturate(1.2);display:none;flex-direction:column;border-top:3px solid var(--c,var(--coral));max-height:min(70vh,560px)}
#card.show{display:flex}
#card header{padding:12px 14px 8px;display:grid;gap:2px}
#card .kind{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--coral))}
#card h2{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.05;margin:0}
#card .sub{font-size:12.5px;color:var(--ink-2);margin:0}
#card .x{position:absolute;top:6px;right:6px;background:transparent;border:0;color:var(--ink-2);font-size:18px;cursor:pointer;line-height:1;padding:4px 8px}
#card dl{margin:0;padding:4px 14px 10px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;overflow:auto;min-height:0}
#card dt{font-size:12.5px;color:var(--ink);min-width:0}
#card dt small{display:block;font-size:10.5px;color:var(--ink-2)}
#card dd{margin:0;font-family:var(--display);font-size:1.35rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#card dd.txt{font-family:var(--body);font-size:12.5px;white-space:normal;max-width:150px}
#card dd.bump{color:var(--coral-2)}
#card .src{font-size:10.5px;color:var(--ink-2);padding:0 14px 12px;border-top:1px solid var(--line);padding-top:8px}
#card .list{padding:0 14px 8px;font-size:12px;display:grid;gap:3px}
#card .list div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
#card .list span:last-child{color:var(--ink-2)}
.label{position:fixed;z-index:2;pointer-events:none;transform:translate(-50%,-100%);font-family:var(--display);font-size:14px;color:var(--ink);background:rgba(251,248,243,.65);padding:1px 7px;border-radius:3px;white-space:nowrap;transition:opacity .2s;will-change:transform}
#tip{position:fixed;z-index:4;pointer-events:none;background:var(--ivory);border:1px solid var(--line);padding:6px 9px;display:none;transform:translate(14px,14px);font-size:12.5px;box-shadow:0 4px 14px rgba(20,16,14,.12)}
#tip.show{display:block}
#tip small{display:block;color:var(--ink-2);font-size:11px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--ivory);padding:7px 14px;font-size:13px;display:none}
#toast.show{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
  #title{max-width:calc(100vw - 32px)}
  #bar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);left:var(--gl);right:var(--gr);overflow-x:auto;scrollbar-width:none}
  .tile{min-width:96px}.tile .v{font-size:1.4rem}
  #legend{max-width:calc(100vw - 32px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;right:var(--gr)}
  .chip{flex:none}
  #controls{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px);right:var(--gr)}
  #controls .btn span{display:none}
  #card{left:var(--gl)!important;right:var(--gr)!important;top:auto!important;bottom:0!important;width:auto;max-height:52vh}
  .label{font-size:12px}
}
</style>

<canvas id="stage" aria-label="3D model of Caleb's real estate business as a small town: office, street of homes with signs, showing cars, courthouse clock, post office, billboard and a construction site"></canvas>

<div id="title" class="hud">
  <p class="eyebrow">Keller Williams First Choice · AIRE</p>
  <h1>AIRE World</h1>
  <div id="live"><i id="dot"></i><b>LIVE</b><span id="upd">loading…</span></div>
</div>

<div id="bar" class="hud" aria-live="polite">
  <div class="tile"><span class="k">Under contract</span><span class="v" data-n="deals.under_contract_volume" data-fmt="money">—</span><span class="s" id="s-uc">—</span></div>
  <div class="tile"><span class="k">Live deals</span><span class="v" data-n="deals.live">—</span><span class="s" id="s-live">—</span></div>
  <div class="tile"><span class="k">Hot · Warm</span><span class="v" id="hw">—</span><span class="s" id="s-hw">—</span></div>
  <div class="tile"><span class="k">Deadlines · 30d</span><span class="v" data-n="calendar.deadlines_30d">—</span><span class="s" id="s-dl">—</span></div>
</div>

<nav id="legend" class="hud" aria-label="Places"></nav>
<div id="controls" class="hud">
  <button class="btn" id="b-spin" aria-pressed="true" title="Slow turn when idle">↻ <span>Turn</span></button>
  <button class="btn" id="b-reset" title="Whole town">⌂ <span>Whole town</span></button>
</div>

<aside id="card" aria-live="polite">
  <button class="x" id="c-close" aria-label="Close">×</button>
  <header><span class="kind" id="c-kind"></span><h2 id="c-title"></h2><p class="sub" id="c-sub"></p></header>
  <dl id="c-stats"></dl>
  <div class="list" id="c-list" hidden></div>
  <div class="src" id="c-src"></div>
</aside>
<div id="tip" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div class="sr" id="sr" aria-live="polite"></div>

<script id="seed" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let DATA=JSON.parse(document.getElementById('seed').textContent);
const C={ink:0x14100e,ivory:0xfbf8f3,coral:0xe87757,gold:0xe9c46a,sage:0x9bbf8a,brick:0xb5563f,oak:0x4f7d4a,oak2:0x6b9a5e,lawn:0xcfe3b4,asphalt:0x5c5856,blue:0x8fb6c9,paper:0xf3ede3,wood:0xc9a27a,roof:0x7a6a62,trunk:0x7c5a3e,moss:0xa9bf8c,glass:0xbfe1ea};
const HEX={office:'#e87757',street:'#d4603f',cars:'#8fb6c9',post:'#4f7d4a',square:'#e9c46a',court:'#6b625a',market:'#b5563f',site:'#c9a27a'};

// ---------- helpers ----------
const get=(o,p)=>p.split('.').reduce((a,k)=>(a==null?undefined:a[k]),o);
const val=p=>{ const v=get(DATA,p); return v&&typeof v==='object'&&'value' in v?v.value:v; };
const money=n=>n==null?'—':('$'+Math.round(n).toLocaleString('en-US'));
const fmt=(v,f)=>v==null?'—':(f==='money'?money(v):(typeof v==='number'?v.toLocaleString('en-US'):String(v)));
const plus=(p)=>{ const v=val(p); const s=get(DATA,p)&&get(DATA,p).source||''; return (v===50&&/50 means/.test(s))?'50+':fmt(v); };

// ---------- three ----------
const canvas=$('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.setClearColor(C.paper,1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(C.paper,70,140);
const camera=new THREE.PerspectiveCamera(32,1,0.5,400);
const cam={theta:0.78,phi:0.95,radius:92,tTheta:0.78,tPhi:0.95,tRadius:92,target:new THREE.Vector3(0,0,1),tTarget:new THREE.Vector3(0,0,1)};
scene.add(new THREE.HemisphereLight(0xfff4e6,0xb9c7a0,0.85));
const sun=new THREE.DirectionalLight(0xfff1dc,1.35); sun.position.set(-28,46,22); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-42; sun.shadow.camera.right=42; sun.shadow.camera.top=42; sun.shadow.camera.bottom=-42; sun.shadow.camera.near=5; sun.shadow.camera.far=130; sun.shadow.bias=-0.0006; sun.shadow.radius=4; scene.add(sun);
const fill=new THREE.DirectionalLight(0xdde9ff,0.35); fill.position.set(30,20,-30); scene.add(fill);

const mats={};
function mat(color,o){ const k=color+'|'+JSON.stringify(o||{}); if(!mats[k]) mats[k]=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.92,metalness:0},o||{})); return mats[k]; }
function rbox(w,h,d,r,color,o){ // rounded box: extruded rounded rect with a bevel for soft edges
  r=Math.min(r,w/2-0.01,d/2-0.01); const s=new THREE.Shape(); const x=-w/2,y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d); s.lineTo(x+r,y+d); s.quadraticCurveTo(x,y+d,x,y+d-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.02,h-2*0.08),bevelEnabled:true,bevelThickness:0.08,bevelSize:0.08,bevelSegments:2,curveSegments:6}); g.rotateX(-Math.PI/2); g.translate(0,0.08,0);
  const m=new THREE.Mesh(g,mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function box(w,h,d,color,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,o)); m.position.y=h/2; m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,color,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14),mat(color)); m.position.y=h/2; m.castShadow=true; m.receiveShadow=true; return m; }
function cone(r,h,color,seg){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||4),mat(color)); m.position.y=h/2; m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,color){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,12),mat(color)); m.castShadow=true; return m; }
function grp(x,y,z){ const g=new THREE.Group(); g.position.set(x,y||0,z); return g; }
function textTex(lines,w,h,opts){ opts=opts||{}; const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle=opts.bg||'#fbf8f3'; g.fillRect(0,0,w,h); if(opts.border){ g.strokeStyle=opts.border; g.lineWidth=w*0.02; g.strokeRect(w*0.02,w*0.02,w-w*0.04,h-w*0.04); }
  let y=opts.top||h*0.22; lines.forEach(l=>{ g.fillStyle=l.color||'#14100e'; g.font=(l.weight||'600')+' '+(l.size||h*0.18)+'px '+(l.serif?"'Instrument Serif',Georgia,serif":"Nunito,'Segoe UI',sans-serif"); g.textAlign=l.align||'center'; g.textBaseline='middle'; g.fillText(l.text,l.x!=null?l.x:w/2,y); y+=(l.gap!=null?l.gap:(l.size||h*0.18)*1.35); });
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
function signPlane(tex,w,h){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,roughness:.8,side:THREE.DoubleSide})); m.castShadow=true; return m; }

// ---------- ground, roads ----------
const world=new THREE.Group(); scene.add(world);
(function(){
  const table=rbox(64,1.2,48,3,0xe3d7c2); table.position.y=-1.3; table.receiveShadow=true; world.add(table);
  const lawn=rbox(62,0.5,46,2.6,C.lawn); lawn.position.y=-0.3; world.add(lawn);
  // ring road: rounded rectangle, drawn as a flat extruded ring
  const outer=new THREE.Shape(); const rr=(s,x,y,w,h,r)=>{ s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); };
  rr(outer,-25,-18.5,50,37,7); const hole=new THREE.Path(); rr(hole,-21.5,-15,43,30,5); outer.holes.push(hole);
  const road=new THREE.Mesh(new THREE.ShapeGeometry(outer,12),mat(C.asphalt,{roughness:.98})); road.rotation.x=-Math.PI/2; road.position.y=0.02; road.receiveShadow=true; world.add(road);
  // main street north-south through the square
  const ms=new THREE.Mesh(new THREE.PlaneGeometry(3.2,30),mat(C.asphalt,{roughness:.98})); ms.rotation.x=-Math.PI/2; ms.position.set(0,0.021,0); ms.receiveShadow=true; world.add(ms);
  // dashes
  const dash=mat(0xf3ede3); for(let i=-13;i<=13;i+=2.4){ const d=new THREE.Mesh(new THREE.PlaneGeometry(0.16,1.1),dash); d.rotation.x=-Math.PI/2; d.position.set(0,0.03,i); world.add(d); }
  // square plaza
  const plaza=new THREE.Mesh(new THREE.CircleGeometry(6.2,40),mat(0xe8dcc6)); plaza.rotation.x=-Math.PI/2; plaza.position.y=0.025; plaza.receiveShadow=true; world.add(plaza);
})();
const ROAD=new THREE.CatmullRomCurve3([[-23.2,-16.7],[0,-16.7],[23.2,-16.7],[23.2,0],[23.2,16.7],[0,16.7],[-23.2,16.7],[-23.2,0]].map(p=>new THREE.Vector3(p[0],0.12,p[1])),true,'catmullrom',0.6);

// ---------- scenery ----------
function tree(x,z,s){ s=s||1; const g=grp(x,0,z); const t=cyl(0.22*s,0.3*s,1.6*s,C.trunk,8); g.add(t); const c1=sph(1.5*s,C.oak); c1.position.y=2.3*s; g.add(c1); const c2=sph(1.1*s,C.oak2); c2.position.set(0.9*s,2.9*s,0.3*s); g.add(c2); const c3=sph(1.0*s,C.oak2); c3.position.set(-0.8*s,2.7*s,-0.5*s); g.add(c3); g.userData.sway=Math.random()*6; world.add(g); return g; }
[[-20,-13],[-12,-13.5],[12,-13.5],[20,-12.5],[-20,13.5],[20,13.5],[-9,2],[9,2],[-14,8],[14,8],[-26,-8],[26,8],[27,-10],[-27,10]].forEach(p=>tree(p[0],p[1],0.8+Math.random()*0.5));
function fence(x,z,len,rotY){ const g=grp(x,0,z); g.rotation.y=rotY||0; for(let i=0;i<len;i+=0.6){ const p=box(0.12,0.75,0.08,C.ivory); p.position.x=i-len/2; g.add(p); } const rail=box(len,0.08,0.06,C.ivory); rail.position.y=0.5; g.add(rail); world.add(g); }
// water tower
(function(){ const g=grp(-26,0,-16); for(let i=0;i<4;i++){ const l=cyl(0.09,0.12,6.5,C.ink,6); l.position.set(Math.cos(i*Math.PI/2+Math.PI/4)*0.9,0,Math.sin(i*Math.PI/2+Math.PI/4)*0.9); l.rotation.z=(i<2?-1:1)*0.06; g.add(l);} const tank=cyl(1.3,1.3,2.2,C.ivory,18); tank.position.y=6.6+1.1; g.add(tank); const cap=cone(1.45,0.9,C.coral,18); cap.position.y=8.8+0.45; g.add(cap); const lab=signPlane(textTex([{text:'ZACHARY',size:40,color:'#14100e',weight:'700'}],256,96,{bg:'#fbf8f3'}),2.4,0.9); lab.position.set(0,7.7,1.32); g.add(lab); world.add(g); })();
// birds
const birds=[]; for(let i=0;i<3;i++){ const b=grp(0,9+i,0); const w1=box(0.5,0.05,0.12,C.ink), w2=box(0.5,0.05,0.12,C.ink); w1.position.x=-0.25; w2.position.x=0.25; b.add(w1,w2); b.userData={w1,w2,t:i*2.1,r:14+i*4}; world.add(b); birds.push(b); }

// ---------- clickable objects ----------
const OBJ={}; const pickables=[];
function register(key,group,label,anchorY){ group.userData.key=key; group.traverse(o=>{ if(o.isMesh){ o.userData.key=key; pickables.push(o);} }); OBJ[key]={group,label,anchorY:anchorY||4}; world.add(group); }

// 1 office
(function(){ const g=grp(-13.5,0,-6); const b=rbox(9,5.4,6.5,0.3,C.brick); g.add(b);
  const base=rbox(9.6,0.5,7.1,0.3,C.ivory); g.add(base);
  const roof=rbox(9.4,0.5,6.9,0.2,C.ivory); roof.position.y=5.4; g.add(roof);
  for(let f=0;f<2;f++) for(let i=0;i<4;i++){ const w=box(1.1,1.2,0.1,C.glass,{roughness:.3,metalness:.1}); w.position.set(-3.1+i*2.05,1.4+f*2.4,3.3); g.add(w); const w2=w.clone(); w2.position.z=-3.3; g.add(w2);}

const S=(p)=>get(DATA,p)||{};
const CARDS={
  office:()=>({kind:'Office · deals and money',title:'Keller Williams First Choice',sub:'Caleb Jackson, REALTOR',stats:[['Under contract',S('deals.under_contract_volume'),'money'],['Live deals',S('deals.live')],['Closed, last 90 days',S('deals.closed_90d')],['Closed volume, 90 days',S('deals.closed_90d_volume'),'money'],['Commission mail, 120 days',S('inbox.commission_mail_120d')]]}),
  street:(house)=>{ const hs=get(DATA,'deals.houses')||[]; const h=hs[house]; const st=[]; if(h){ st.push(['This house',{value:(SIGN[h.stage]||SIGN.lead).txt.toLowerCase(),period:h.side},'txt']); if(h.price) st.push(['Price',{value:h.price,period:'Deals tab'},'money']); if(h.close) st.push(['Expected close',{value:h.close,period:'Deals tab'},'txt']); } st.push(['Active listings',S('deals.active_listings')],['Under contract',S('deals.under_contract')],['Next closing',S('deals.next_close'),'txt']); return {kind:h?('House '+(house+1)+' of '+hs.length):'The street',title:h?((h.side==='listing'?'Listing':'Buyer')+', '+(h.stage||'').replace('_',' ')):'The street',sub:'One house per deal in the Deals tab. Stage and price only, never the address.',stats:st}; },
  cars:()=>({kind:'Showings',title:'Showing cars',sub:'One car per ShowingTime email this week, up to eight.',stats:[['ShowingTime mail, 7 days',S('showings.emails_7d')],['ShowingTime mail, 30 days',S('showings.emails_30d')],['Active listings',S('deals.active_listings')],['Next on the calendar',S('calendar.next_event'),'txt']]}),
  post:()=>({kind:'Inbox',title:'Post office',sub:'What came in, counted from Gmail. Nothing is read here.',stats:[['Inbox threads, 3 days',S('inbox.threads_3d')],['Website lead mail, 7 days',S('inbox.website_leads_7d')],['Signatures, 30 days',S('engine.signatures_30d')],['Commission mail, 120 days',S('inbox.commission_mail_120d')]]}),
  square:()=>({kind:'The sphere',title:'Town square',sub:'Everyone in the one CRM sheet. Walkers: two plus one per fifteen hot contacts.',stats:[['Contacts',S('people.contacts')],['Hot',S('people.hot')],['Warm',S('people.warm')],['New leads, 7 days',S('people.new_leads_7d')],['New leads, 30 days',S('people.new_leads_30d')],['Touched, 30 days',S('people.touched_30d')],['Next actions waiting',S('people.next_actions')],['Past clients',S('people.past_clients')]],list:(get(DATA,'people.by_city')||[]).map(c=>[c.city,c.n+' people'])}),
  court:()=>({kind:'Calendar',title:'Courthouse clock',sub:'Today and the deadlines your TC filed. Kind and date only.',stats:[['Events today',S('calendar.events_today')],['Next event',S('calendar.next_event'),'txt'],['Deadlines, 30 days',S('calendar.deadlines_30d')],['Tasks open',S('engine.tasks_open')],['Tasks overdue',S('engine.tasks_overdue')]],list:(get(DATA,'calendar.deadlines')||[]).map(d=>[d.kind,d.date])}),
  market:()=>{ const gb=get(DATA,'market.gbrar'); const st=gb?[['Median sale price',gb.median_price,'money'],['Days on market',gb.days_on_market],['Months of supply',gb.months_supply],['New listings',gb.new_listings],['Closed sales',gb.closed_sales],['Homes for sale',gb.homes_for_sale]]:[]; return {kind:'Market',title:'Market billboard',sub:gb?(gb.source||''):'No GBRAR report synced.',stats:st,src:gb?('Period '+gb.month+'. Prior and year over year are in data.json.'):''}; },
  site:()=>{ const m=get(DATA,'market.monitor'); const st=[]; if(m){ st.push(['Monitor rows',m.rows]); Object.entries(m.by_type||{}).slice(0,5).forEach(([k,v])=>st.push([k.replace('_',' '),{value:v,period:'cached'}])); st.push(['Touches due today',S('engine.touches_due')],['Owe a reply',S('engine.owes_reply')]); } st.push(['Tasks open',S('engine.tasks_open')],['Tasks done, 7 days',S('engine.tasks_done_7d')]); return {kind:'Market Monitor',title:'Construction site',sub:m?'Permits and listing changes around your farms, from the Mac cache.':'The Market Monitor fills in when sync.py runs on the Mac next to feed.json. Until then this card shows the task engine.',stats:st}; },
};
function renderCard(){ if(!sel) return; const c=CARDS[sel.key](sel.house); const card=$('#card'); card.style.setProperty('--c',HEX[sel.key]); $('#c-kind').textContent=c.kind; $('#c-title').textContent=c.title; $('#c-sub').textContent=c.sub; const dl=$('#c-stats'); dl.innerHTML=''; const srcs=new Set();
  c.stats.forEach(([label,st,f])=>{ st=st||{}; const dt=document.createElement('dt'); dt.textContent=label; const sm=document.createElement('small'); sm.textContent=st.period||''; dt.appendChild(sm); const dd=document.createElement('dd'); const v=st.value; const isTxt=f==='txt'||(typeof v==='string'&&!/^\d/.test(v)); dd.className=isTxt?'txt':''; dd.dataset.key=sel.key+'|'+label; const shown=(v===50&&/50 means/.test(st.source||''))?'50+':fmt(v,f); dd.textContent=shown==null?'—':shown; dd.dataset.v=String(v); if(st.source) srcs.add(st.source); dl.append(dt,dd); });
  const list=$('#c-list'); list.innerHTML=''; if(c.list&&c.list.length){ list.hidden=false; c.list.forEach(([a,b])=>{ const d=document.createElement('div'); const s1=document.createElement('span'); s1.textContent=a; const s2=document.createElement('span'); s2.textContent=b; d.append(s1,s2); list.appendChild(d); }); } else list.hidden=true;
  $('#c-src').textContent=c.src||('Sources: '+[...srcs].join(' · ')); }
$('#c-close').onclick=clearSel;

// ---------- legend, controls, keys ----------
(function(){ const nav=$('#legend'); Object.keys(OBJ).forEach((k,i)=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.dataset.key=k; b.style.setProperty('--c',HEX[k]); b.setAttribute('aria-pressed','false'); b.innerHTML='<i></i><span></span>'; b.children[1].textContent=OBJ[k].label; b.title='Key '+(i+1); b.onclick=()=>select(k); nav.appendChild(b); }); })();
$('#b-spin').onclick=e=>{ spin=!spin; e.currentTarget.setAttribute('aria-pressed',String(spin)); };
$('#b-reset').onclick=()=>{ clearSel(); fitWhole(); cam.tTarget.set(0,0,1); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(sel) clearSel(); else { fitWhole(); cam.tTarget.set(0,0,1);} } else if(e.key===' '){ e.preventDefault(); spin=!spin; $('#b-spin').setAttribute('aria-pressed',String(spin)); } else if(/^[1-8]$/.test(e.key)){ const k=Object.keys(OBJ)[+e.key-1]; if(k) select(k); } });
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove('show'),2600); }

// ---------- live data ----------
function tween(el,from,to,f){ if(reduced||typeof to!=='number'||typeof from!=='number'){ el.textContent=fmt(to,f); return; } const t0=performance.now(); const d=900; const step=now=>{ const k=Math.min(1,(now-t0)/d); const e=1-Math.pow(1-k,3); el.textContent=fmt(from+(to-from)*e,f); if(k<1) requestAnimationFrame(step); else el.textContent=fmt(to,f); }; requestAnimationFrame(step); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),1400); }
function applyData(fresh,first){ const old=DATA; DATA=fresh;
  document.querySelectorAll('[data-n]').forEach(el=>{ const p=el.dataset.n; const nv=val(p), ov=p.split('.').reduce((a,k)=>(a==null?undefined:a[k]),old); const ovv=ov&&typeof ov==='object'?ov.value:ov; if(first||nv!==ovv) tween(el,typeof ovv==='number'?ovv:nv,nv,el.dataset.fmt); });
  $('#hw').textContent=fmt(val('people.hot'))+' · '+fmt(val('people.warm'));
  $('#s-uc').textContent=fmt(val('deals.under_contract'))+' deals · next close '+(val('deals.next_close')||'—');
  $('#s-live').textContent=fmt(val('deals.active_listings'))+' listings active · '+fmt(val('deals.closed_90d'))+' closed in 90d';
  $('#s-hw').textContent='of '+fmt(val('people.contacts'))+' contacts · '+fmt(val('people.new_leads_7d'))+' new this week';
  const dls=get(DATA,'calendar.deadlines')||[]; $('#s-dl').textContent=dls.length?('next: '+dls[0].kind.replace(/ deadline$/i,'')+' · '+dls[0].date.slice(5)):'none filed';
  const changedHouses=JSON.stringify(get(old,'deals.houses'))!==JSON.stringify(get(DATA,'deals.houses')); if(first||changedHouses) buildStreet();
  if(first||val('showings.emails_7d')!==(get(old,'showings.emails_7d')||{}).value) buildCars();
  if(first||val('people.hot')!==(get(old,'people.hot')||{}).value) buildWalkers();
  paintBoard(); if(sel){ const prev=[...document.querySelectorAll('#c-stats dd')].map(d=>[d.dataset.key,d.dataset.v,d.textContent]); renderCard(); document.querySelectorAll('#c-stats dd').forEach(d=>{ const p=prev.find(x=>x[0]===d.dataset.key); if(p&&p[1]!==d.dataset.v&&!d.classList.contains('txt')){ const a=+p[1],b=+d.dataset.v; if(!isNaN(a)&&!isNaN(b)) tween(d,a,b,/\$/.test(d.textContent)?'money':undefined); } }); }
  liveDot(); }
function liveDot(){ const s=DATA.sync||{}; const at=s.at?new Date(s.at):null; const min=at?Math.max(0,Math.round((Date.now()-at)/60000)):null; const dot=$('#dot'); const stale=min==null||min>30||s.ok===false; dot.classList.toggle('stale',stale);
  $('#upd').textContent=min==null?'no sync yet':((s.ok===false?'last good sync ':'updated ')+(min<1?'just now':min+' min ago')+(s.ok===false?' · last sync failed':'')); }
async function refresh(){ try{ const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); const j=await r.json(); if(j&&j.sync) applyData(j,false); }catch(e){ /* file:// or offline: keep the seed */ } liveDot(); }
applyData(DATA,true); setInterval(refresh,60000); setInterval(liveDot,30000); setTimeout(refresh,1500);

// ---------- animation ----------
const clock=new THREE.Clock(); let T=0;
function frame(){ requestAnimationFrame(frame); if(document.hidden) return; const dt=Math.min(clock.getDelta(),0.05); T+=dt; idleT+=dt;
  if(spin&&idleT>4&&!sel) cam.tTheta+=dt*0.04;
  const k=1-Math.pow(0.0015,dt); cam.theta+=(cam.tTheta-cam.theta)*k; cam.phi+=(cam.tPhi-cam.phi)*k; cam.radius+=(cam.tRadius-cam.radius)*k*0.8; cam.target.lerp(cam.tTarget,k*0.8);
  camera.position.set(cam.target.x+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta)); camera.lookAt(cam.target);
  // cars on the ring road
  const tmp=new THREE.Vector3(); cars.forEach(c=>{ c.t=(c.t+c.v*dt*(0.8+0.2*Math.sin(c.t*Math.PI*8)))%1; const p=ROAD.getPointAt(c.t); const q=ROAD.getPointAt((c.t+0.01)%1); c.g.position.copy(p); c.g.lookAt(q.x,p.y,q.z); c.g.rotateY(Math.PI/2); });
  // walkers
  walkers.forEach(w=>{ w.t+=w.v*dt*w.dir; if(w.t>1){w.t=1;w.dir=-1;} if(w.t<0){w.t=0;w.dir=1;} tmp.lerpVectors(w.from,w.to,w.t); w.g.position.copy(tmp); w.g.position.y=Math.abs(Math.sin(w.t*40))*0.08; w.g.lookAt(w.dir>0?w.to:w.from); });
  // office flag, mailbox flag, truck, fountain, moss, crane, signs, trees, birds, clock
  const of=OBJ.office.group.userData.flag; of.rotation.y=Math.sin(T*3)*0.15; of.scale.x=1+Math.sin(T*6)*0.05;
  const po=OBJ.post.group.userData; const cyc=(T%24); po.truck.position.x=cyc<6?-14+cyc*2.4:(cyc<14?0.4:(cyc<20?0.4+(cyc-14)*2.4:14.8)); po.truck.visible=cyc<20; po.mflag.rotation.z=cyc>6&&cyc<14?-Math.PI/2:0;
  const sq=OBJ.square.group.userData; sq.jet.position.y=2.4+Math.sin(T*4)*0.12; sq.jet.scale.setScalar(1+Math.sin(T*4)*0.15); sq.oak.children.forEach(m=>{ if(m.userData.moss) m.rotation.z=Math.sin(T*1.3+m.position.x)*0.12; });
  if(crane) crane.userData.arm.rotation.y=Math.sin(T*0.35)*0.9+0.6;
  houses.forEach(h=>{ h.g.userData.sign.rotation.y=Math.sin(T*2+h.g.userData.swing)*0.08; });
  world.children.forEach(o=>{ if(o.userData.sway!=null) o.rotation.z=Math.sin(T*0.8+o.userData.sway)*0.02; });
  birds.forEach(b=>{ b.userData.t+=dt*0.5; const r=b.userData.r; b.position.set(Math.cos(b.userData.t)*r,10+Math.sin(b.userData.t*2)*0.6,Math.sin(b.userData.t)*r*0.6); b.rotation.y=-b.userData.t+Math.PI/2; const f=Math.sin(T*12)*0.5; b.userData.w1.rotation.z=f; b.userData.w2.rotation.z=-f; });
  if(clockHands){ const now=new Date(); clockHands.m.rotation.z=-(now.getMinutes()/60)*Math.PI*2; clockHands.h.rotation.z=-((now.getHours()%12)/12+now.getMinutes()/720)*Math.PI*2; }
  const lamp=OBJ.court.group.userData.lamp; const dls=get(DATA,'calendar.deadlines')||[]; const todayS=new Date().toISOString().slice(0,10); const hot=dls.some(d=>d.date===todayS); lamp.material.emissiveIntensity=hot?0.6+Math.sin(T*5)*0.5:0.15;
  renderer.render(scene,camera); placeLabels(); }
frame();
})();
</script>
