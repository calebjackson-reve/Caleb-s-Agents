# Deploys website-rebuild to GitHub Pages. Runs only when Caleb triggers it by hand
# or when main changes under website-rebuild/. Pages must be set to "GitHub Actions"
# as the source in Settings > Pages before the first run.
name: Deploy calebjackson.org
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website-rebuild/site/**', 'website-rebuild/media/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 website-rebuild/site/scripts/build.py
      - run: python3 website-rebuild/site/scripts/dist.py website-rebuild/dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: website-rebuild/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
